permissions:
  contents: read

jobs:
  trusted-country-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts and server boundary prerequisites
        run: |
          pnpm --filter @econmind/core build
          pnpm --filter @econmind/world-worker build
          pnpm --filter @econmind/world-api build
      - name: Actual offline runtime lifecycle and reviewed controller regressions
        run: pnpm exec vitest run --reporter=verbose tests/world-web/trusted-country-runtime.test.ts tests/world-web/local-command-disconnect-liveness.test.ts tests/world-web/local-command-loop.test.ts tests/world-web/local-authorized-read.test.ts tests/world-web/official-metric-source.test.ts tests/world-web/financial-intake.test.ts tests/architecture/world-web-shared-core-ci-prerequisites.test.ts
      - name: Classified financial position and authenticated read regressions
        run: pnpm exec vitest run --reporter=verbose tests/world-web/current-financial-position.test.ts tests/world-web/economic-visibility-consumer.test.ts tests/world-api/financial-position-read-binding.test.ts tests/integration/staged-narrow-transfer-http.test.ts tests/integration/world-api-authenticated-read-boundary.test.ts
      - name: Source-blocked manual command and Captain preparation regressions
        run: pnpm exec vitest run --reporter=verbose tests/world-api/authenticated-office-command.test.ts tests/world-core/captain-runtime-source-adapter.test.ts tests/world-core/captain-political-capital-slice.test.ts
      - name: Exact reviewed schema and immutable provenance regressions (ephemeral only)
        run: |
          pnpm migration:validate
          node --test tests/foundation/migration-rehearsal-filtered-provenance.test.mjs
          pnpm exec vitest run --reporter=verbose --no-file-parallelism tests/world-core/production-posting-schema.test.ts tests/foundation/snapshot-storage-migration-policy.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.f-production-schema.json
      - name: Owned lifecycle HTTP cleanup and strict original test types
        run: |
          pnpm exec vitest run --reporter=verbose tests/foundation/public-runtime-http-probe.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.public-runtime-http-probe.json
      - name: Committed Country and Office source evidence without weakened authorization
        run: |
          pnpm exec vitest run --reporter=verbose tests/integration/v10-1-country-office-read-flow.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.country-office-committed-fixture.json
      - name: Conditional positive manual SQL intake and queue acknowledgement
        run: |
          pnpm exec vitest run --reporter=verbose tests/world-api/positive-manual-office-command.test.ts
          pnpm exec tsc --noEmit -p tests/world-api/tsconfig.positive-manual-office-command.json
      - name: Explicit Office HTTP transport and real source-service regressions
        # Explicit adapter only: no default host, consumer or production activation.
        run: |
          pnpm exec vitest run --reporter=verbose tests/world-api/https-authenticated-office-command-route.test.ts
          pnpm exec tsc --noEmit -p tests/world-api/tsconfig.https-office-command-route.json
      - name: Private opening authority and actual blocked-source regressions
        run: |
          pnpm exec vitest run --reporter=verbose tests/world-core/official-opening-admission-publication.test.ts tests/world-core/official-opening-decision-reconciliation.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.official-opening-admission-publication.json
      - name: Explicit opening bytes, API host and browser session composition (nonactivated only)
        run: |
          pnpm exec vitest run --reporter=verbose --no-file-parallelism tests/world-core/official-opening-bundle-preflight.test.ts tests/world-api/nonactivated-runtime-api-host.test.ts tests/world-web/trusted-host-session.test.ts tests/world-web/trusted-host-financial-privacy.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.official-opening-bundle-preflight.json
          pnpm exec tsc --noEmit -p tests/world-api/tsconfig.nonactivated-runtime-api-host.json
          pnpm exec tsc --noEmit -p tests/world-web/trusted-host-session.tsconfig.json
      - name: Sole manual dispatcher and formal Social source compatibility
        run: |
          pnpm exec vitest run --reporter=verbose --no-file-parallelism tests/world-core/manual-office-durable-dispatch.test.ts tests/world-core/c-social-employment-service.test.ts tests/world-core/durable-command-consumption.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.g-manual-office-dispatch.json
      - name: Scoped office decision results across the strict read boundary
        run: |
          pnpm exec vitest run --reporter=verbose --no-file-parallelism tests/world-core/office-decision-result-projector.test.ts tests/integration/world-api-postgres-read-adapter.test.ts tests/world-core/v10-authoritative-activity-read-projection-publisher.test.ts
          pnpm exec tsc --noEmit -p tests/support/tsconfig.office-decision-results.json
      - name: Classified decision result drawer and closed-state privacy cleanup
        run: |
          pnpm exec vitest run --reporter=verbose --no-file-parallelism tests/world-web/office-decision-result-consumer.test.ts tests/world-web/office-projection-closed-drawer.test.ts
          pnpm exec tsc --noEmit -p tests/world-web/office-decision-result-consumer.tsconfig.json
      - name: Exact unregistered release policy and formal country boot guards
        run: |
          node --test tests/foundation/production-posting-release-policy.test.mjs
          pnpm exec tsc --noEmit -p tests/support/tsconfig.f-production-posting-release.json
          pnpm exec vitest run --reporter=verbose tests/world-web/official-country-boot-guard.test.ts tests/world-web/country-module-home-guard.test.ts tests/world-web/boot-publication-integrity.test.ts tests/world-web/visual-publication-integrity.test.ts
      - name: Focused typecheck, lint and format
        run: |
          pnpm --filter @econmind/world-web typecheck
          pnpm exec tsc --noEmit --target ES2024 --lib ES2024,DOM,DOM.Iterable --module ESNext --moduleResolution bundler --jsx react-jsx --skipLibCheck --strict --exactOptionalPropertyTypes --noUncheckedIndexedAccess --types node,vite/client tests/world-web/trusted-country-runtime.test.ts
          pnpm exec eslint apps/world-web/src/country-runtime apps/world-web/vite.config.ts tests/world-web/trusted-country-runtime.test.ts tests/world-web/official-metric-source.test.ts
          pnpm exec prettier --check apps/world-web/src/country-runtime apps/world-web/vite.config.ts tests/world-web/trusted-country-runtime.test.ts tests/world-web/official-metric-source.test.ts .github/workflows/trusted-country-runtime.yml
      - name: Browser ownership, environment, secrets and immutable UI source boundaries
        run: |
          node scripts/check-boundaries.mjs
          pnpm env:check
          pnpm secrets:check
          pnpm test:authoritative-ui
      - name: Default disconnected non-authoritative static build
        run: pnpm --filter @econmind/world-web build
