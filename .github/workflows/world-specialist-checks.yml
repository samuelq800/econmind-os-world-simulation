# Consolidated legacy specialist checks; see docs/runbooks/GITHUB_ACTIONS.zh-CN.md.
name: World specialist checks (select one suite)
run-name: Specialist · ${{ inputs.suite || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select one isolated specialist acceptance suite (no deployment)
        required: true
        type: choice
        default: world-v2-api-reader-readback-audit
        options:
          - e-world-v2-release-handoff
          - f-durable-command-intake
          - f-official-opening
          - gate-b-disposable-diagnostic
          - narrow-transfer-approval-reference
          - staged-narrow-transfer-http
          - v30-2-postgres-permission-negatives
          - v30-3-local-authenticated-bridge
          - v30-4-buyer-finance-approval-reader
          - v30-disposable-restore
          - world-v2-api-full-reader-role
          - world-v2-api-reader-readback-audit-postgres
          - world-v2-api-reader-readback-audit
          - world-v2-api-reader-role
  push:
    branches:
      - codex/e-world-v2-release-handoff
      - codex/f-durable-command-receipt
      - codex/f-opening-seed-70-country
      - codex/narrow-transfer-approval-reference
      - codex/staged-narrow-transfer-http
      - codex/live-command-bridge
      - codex/e-gateb-auth-chain
      - codex/e-buyer-finance-reader-native
      - codex/e-official-data-full-reader
      - codex/e-reader-readback-audit
      - codex/e-official-data-release

permissions:
  contents: read

jobs:
  select-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject unknown suites instead of reporting an empty successful run
        env:
          SUITE: ${{ inputs.suite }}
        shell: bash
        run: |
          case "$SUITE" in
            e-world-v2-release-handoff|f-durable-command-intake|f-official-opening|gate-b-disposable-diagnostic|narrow-transfer-approval-reference|staged-narrow-transfer-http|v30-2-postgres-permission-negatives|v30-3-local-authenticated-bridge|v30-4-buyer-finance-approval-reader|v30-disposable-restore|world-v2-api-full-reader-role|world-v2-api-reader-readback-audit-postgres|world-v2-api-reader-readback-audit|world-v2-api-reader-role)
              printf 'Selected specialist suite: %s\n' "$SUITE" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              printf 'Unknown specialist suite\n' >&2
              exit 1
              ;;
          esac

  # Former entry: .github/workflows/e-world-v2-release-handoff.yml
  e-world-v2-release-handoff:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'e-world-v2-release-handoff') || (github.event_name == 'push' && contains(fromJSON('["refs/heads/codex/e-world-v2-release-handoff"]'), github.ref))
    name: Disposable PostgreSQL 17 release handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: econmind_v09
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d econmind_v09"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ECONMIND_ENV: ci
      V09_TEST_DATABASE_FINGERPRINT: world-v2-v09-test-ci
      V09_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/econmind_v09
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:validate
      - name: Rehearse the release handoff on disposable PostgreSQL 17
        run: pnpm test:world-v2-release-handoff:postgres

