name: World V2 exact Storage veto candidate
on:
  pull_request:
    paths:
      - database/migrations/**
      - scripts/migration-policy.mjs
      - scripts/rehearse-migrations.mjs
      - tests/foundation/snapshot-storage-migration-policy.test.ts
      - .github/workflows/world-v2-snapshot-storage-veto.yml
permissions:
  contents: read
jobs:
  scoped-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:validate
      - run: pnpm exec vitest run tests/foundation/snapshot-storage-migration-policy.test.ts tests/foundation/environment-release-foundation.test.ts
      - run: pnpm migration:rehearse
      - run: pnpm exec eslint scripts/migration-policy.mjs scripts/rehearse-migrations.mjs tests/foundation/snapshot-storage-migration-policy.test.ts
      - run: pnpm exec prettier --check scripts/migration-policy.mjs scripts/rehearse-migrations.mjs database/migrations/manifest.json tests/foundation/snapshot-storage-migration-policy.test.ts .github/workflows/world-v2-snapshot-storage-veto.yml
