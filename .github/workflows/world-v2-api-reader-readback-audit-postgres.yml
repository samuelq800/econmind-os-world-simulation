name: World V2 reader readback audit native PostgreSQL

on:
  workflow_dispatch:
  push:
    branches:
      - codex/e-reader-readback-audit
    paths:
      - .github/workflows/world-v2-api-reader-readback-audit-postgres.yml
      - database/migrations/**
      - scripts/migration-policy.mjs
      - scripts/render-world-v2-api-reader-readback-audit.mjs
      - tests/integration/world-v2-api-reader-readback-audit-postgres.test.ts

permissions:
  contents: read

jobs:
  native-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: econmind_v09
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d econmind_v09"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ECONMIND_ENV: ci
      V09_TEST_DATABASE_FINGERPRINT: world-v2-v09-test-ci
      V09_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/econmind_v09
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:validate
      - run: node scripts/test-world-v2-api-reader-readback-audit.mjs
      - run: pnpm exec vitest run tests/integration/world-v2-api-reader-readback-audit-postgres.test.ts
