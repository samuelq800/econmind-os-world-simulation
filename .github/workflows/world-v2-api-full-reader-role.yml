name: World V2 full-data reader role

on:
  workflow_dispatch:
  push:
    branches:
      - codex/e-official-data-full-reader
    paths:
      - .github/workflows/world-v2-api-full-reader-role.yml
      - artifacts/world-balanced-candidate-v1/CHECKSUMS.json
      - database/migrations/**
      - package.json
      - scripts/migration-policy.mjs
      - scripts/validate-migrations.mjs
      - tests/integration/world-v2-api-full-reader-role-postgres.test.ts

permissions:
  contents: read

jobs:
  native-full-reader-role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: econmind_v09
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d econmind_v09"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ECONMIND_ENV: ci
      V09_TEST_DATABASE_FINGERPRINT: world-v2-v09-test-ci
      V09_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/econmind_v09
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:validate
      - run: pnpm exec vitest run tests/integration/world-v2-api-full-reader-role-postgres.test.ts
