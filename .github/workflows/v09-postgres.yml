name: V09 PostgreSQL candidate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character main SHA to execute against the disposable service
        required: true
        type: string
      mode:
        description: Run the durable evidence runner or one redacted migration diagnostic
        required: true
        default: evidence
        type: choice
        options:
          - evidence
          - diagnose
  push:
    branches:
      - codex/world-core-v09
      - codex/v09-recovery-preparation
      - codex/v10-1-implementation
      - codex/v09-v10-composite
  pull_request:
    paths:
      - .github/workflows/v09-postgres.yml
      - database/migrations/**
      - package.json
      - pnpm-lock.yaml
      - scripts/v09-postgres-test-environment.mjs
      - tests/world-core/world-writer-lease-postgres.test.ts
      - tests/world-core/v09-atomic-recovery-postgres.test.ts
      - tests/world-core/v10.4-local-acceptance.test.ts

permissions:
  contents: read

jobs:
  disposable-v09-gate-b-runner:
    if: github.event_name == 'workflow_dispatch'
    name: Frozen V09 disposable runner evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: econmind_v09
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d econmind_v09"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ECONMIND_ENV: ci
      TARGET_SHA: ${{ inputs.target_sha }}
      V09_DISPOSABLE_EVIDENCE_CONFIRMATION: EXECUTE_DISPOSABLE_V09_POSTGRES_EVIDENCE
      V09_TEST_DATABASE_FINGERPRINT: world-v2-v09-test-ci
      V09_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/econmind_v09
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}
      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$TARGET_SHA"
          printf 'frozen_main_sha=%s\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:validate
      - name: Run disposable PostgreSQL evidence
        if: inputs.mode == 'evidence'
        shell: bash
        env:
          V09_DISPOSABLE_EVIDENCE_OUTPUT: ${{ runner.temp }}/v09-disposable-evidence.json
        run: |
          set -o pipefail
          pnpm test:v09:disposable-evidence 2>&1 | tee "$RUNNER_TEMP/v09-disposable-evidence.log"
      - name: Diagnose first disposable migration failure
        if: inputs.mode == 'diagnose'
        shell: bash
        env:
          V09_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/v09-disposable-diagnostic.json
          V09_DISPOSABLE_EVIDENCE_OUTPUT: ${{ runner.temp }}/v09-disposable-runner-contract.json
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee "$RUNNER_TEMP/v09-disposable-diagnostic.log"
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';

          import { Client } from 'pg';

          import { runV09DisposablePostgresEvidence } from './scripts/v09-staging-evidence-runner.mjs';

          function redact(value) {
            return String(value ?? 'unknown')
              .replaceAll(process.env.V09_TEST_DATABASE_URL, '[REDACTED_URL]')
              .replace(/postgres(?:ql)?:\/\/\S+/giu, '[REDACTED_URL]')
              .replace(/(password|token)\s*=\s*\S+/giu, '$1=[REDACTED]')
              .slice(0, 500);
          }

          let firstQueryFailure;
          const clientFactory = ({ connectionString }) => {
            const client = new Client({ connectionString });
            return Object.freeze({
              connect: async () => client.connect(),
              end: async () => client.end(),
              execute: async ({ step, text, values }) => {
                try {
                  return values.length === 0
                    ? await client.query(text)
                    : await client.query(text, values);
                } catch (error) {
                  firstQueryFailure ??= {
                    message: redact(error?.message),
                    postgres_code: redact(error?.code),
                    sql_bytes: Buffer.byteLength(text, 'utf8'),
                    sql_sha256: createHash('sha256').update(text, 'utf8').digest('hex'),
                    step,
                  };
                  throw error;
                }
              },
            });
          };

          const evidence = await runV09DisposablePostgresEvidence({
            clientFactory,
            writeEvidence: async () => undefined,
          });
          const diagnostic = {
            diagnosis_schema: 'V09_DISPOSABLE_DIAGNOSTIC-1',
            first_query_failure: firstQueryFailure ?? null,
            runner_failure: evidence.failure ?? null,
            runner_status: evidence.status,
          };
          await writeFile(
            process.env.V09_DIAGNOSTIC_OUTPUT,
            `${JSON.stringify(diagnostic, null, 2)}\n`,
            { encoding: 'utf8', flag: 'wx' },
          );
          console.log(JSON.stringify(diagnostic, null, 2));
          if (firstQueryFailure === undefined) {
            throw new Error('diagnostic expected a query failure but did not observe one');
          }
          process.exitCode = 1;
          NODE
      - name: Upload redacted disposable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v09-disposable-evidence-${{ inputs.target_sha }}
          path: |
            ${{ runner.temp }}/v09-disposable-evidence.json
            ${{ runner.temp }}/v09-disposable-evidence.log
            ${{ runner.temp }}/v09-disposable-diagnostic.json
            ${{ runner.temp }}/v09-disposable-diagnostic.log
          if-no-files-found: error

  real-postgres-v09-1:
    if: github.event_name != 'workflow_dispatch'
    name: Disposable PostgreSQL V09/V10 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: econmind_v09
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d econmind_v09"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ECONMIND_ENV: ci
      V09_TEST_DATABASE_FINGERPRINT: world-v2-v09-test-ci
      V09_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/econmind_v09
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:validate
      - run: pnpm test:v09:postgres
      - run: pnpm --filter @econmind/core build
      - run: pnpm --filter @econmind/world-worker build
      - run: pnpm exec vitest run tests/world-core/v09-commit-authorization-cutoff.test.ts
      - run: pnpm exec vitest run tests/world-core/v09-atomic-recovery-postgres.test.ts
      - run: pnpm test:v10.4:postgres
      - run: pnpm exec vitest run tests/world-core/v09-world-recovery-preparation.test.ts

  official-pnpm-check:
    if: github.event_name != 'workflow_dispatch'
    name: Isolated official pnpm check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unmodified official pnpm check
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee official-pnpm-check.log
      - name: Upload raw official check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-pnpm-check-${{ github.sha }}
          path: official-pnpm-check.log
          if-no-files-found: error
