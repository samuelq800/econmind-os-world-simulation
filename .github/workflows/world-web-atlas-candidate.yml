name: World web atlas candidate (no deploy)

on:
  pull_request:
    paths:
      - .github/workflows/world-web-atlas-candidate.yml
      - apps/world-web/**
      - tests/world-web/callum-home-mosaic.test.ts
      - tests/world-web/world-public-preview.test.ts
      - tests/world-web/fictional-atlas.test.ts
      - tests/world-web/detail-tile-visibility.test.ts
      - docs/reports/world-connection/F_CALLUM_ISLAND_MOSAIC_HOME_2026_09_30.md
      - scripts/verify-authoritative-ui-publication.mjs
      - scripts/sync-official-ui-country-data.mjs
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused atlas and public-preview tests
        run: pnpm exec vitest run tests/world-web/callum-home-mosaic.test.ts tests/world-web/detail-tile-visibility.test.ts tests/world-web/world-public-preview.test.ts tests/world-web/fictional-atlas.test.ts
      - name: World web typecheck and build
        run: pnpm --filter @econmind/world-web build
      - name: Selected national UI publication boundary
        run: pnpm test:authoritative-ui
      - name: Focused lint and format
        run: |
          pnpm exec eslint apps/world-web/src/App.tsx apps/world-web/src/map-explorer/WorldExplorer.tsx apps/world-web/src/map-explorer/continent-layout.ts apps/world-web/src/map-explorer/detail-tile-visibility.ts tests/world-web/callum-home-mosaic.test.ts tests/world-web/detail-tile-visibility.test.ts tests/world-web/world-public-preview.test.ts
          pnpm exec prettier --check .github/workflows/world-web-atlas-candidate.yml apps/world-web/src/map-explorer/WorldExplorer.tsx apps/world-web/src/map-explorer/detail-tile-visibility.ts tests/world-web/detail-tile-visibility.test.ts
